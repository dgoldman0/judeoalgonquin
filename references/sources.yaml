schema_version: 1
registry_status: foundation
last_verified: "2026-07-12"

verification_policy:
  meaning: >-
    Verified means that the URL was reachable and the publisher or community
    identity was confirmed on the verification date. It does not grant reuse
    rights, validate every statement, or permit transfer between language lects.
  default_bulk_reuse: not_cleared
  canonical_import: per_entry_review_required

design_source_path:
  algonquian:
    regional_anchor:
      - Munsee Delaware
      - Lunaape
    first_gap_search:
      - Mahican
      - Mohican
      - explicitly identified Lenape lects
    broader_gap_search:
      - Algonquin
      - Ojibwe
      - Mi'gmaq
      - Mi'kmaq
      - Penobscot
      - other explicitly identified Algonquian languages
    rule: >-
      A broader source may fill a documented lexical or design gap only after
      regional sources prove insufficient. The record retains its exact source
      label, rationale, and transformation; it is never silently made Munsee.
  hebrew:
    ordinary_life:
      - Modern Hebrew
      - common Hebrew
    narrative_and_literary:
      - Biblical Hebrew
      - Classical Hebrew
    additional_labeled_sources:
      - rabbinic
      - liturgical
      - regional
      - diaspora
    rule: >-
      Hebrew is a co-parent and may contribute vocabulary, morphology, syntax,
      and discourse across domains rather than only abstract or elevated material.

