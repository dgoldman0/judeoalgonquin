      note: Talking dictionary states that each headword is recorded by at least three speakers and used in a phrase.

required_source_gaps:
  - id: munsee_current_community_lexical_guidance
    need: >-
      Current community guidance on preferred Munsee spelling, pronunciation,
      and acceptable use beyond published dictionary consultation.
    blocks:
      - canonical Munsee-derived orthography
      - systematic lexical epochs

  - id: mahican_normative_reference
    need: >-
      A current, community-connected Mahican/Mohican reference suitable for
      exact lexical and grammatical citation.
    blocks:
      - canonical Mahican-derived paradigms

  - id: biblical_hebrew_grammar
    need: >-
      A suitable scholarly primary reference for claims about Biblical Hebrew
      narrative morphology and discourse, especially wayyiqtol and weqatal,
      with page-level citations and attention to their contextual functions.
    blocks:
      - canonical wayyiqtol-derived or weqatal-derived construction records

  - id: source_reuse_permissions
    need: >-
      Recorded terms or permissions for any source proposed for systematic
      extraction or bulk storage.
    blocks:
      - bulk source ingestion
